version: '3'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  was:
    image: ji0513ji/log-generator:1.1.2
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./minio-data:/data

  # Bronze Service (E 단계 → Raw Layer)
  spark-bronze:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - minio
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    command: ["python3", "minio_e.py"]
    # volumes:
    #   - ./checkpoints/bronze:/app/checkpoints

  # Silver Service (T 단계 → Silver Layer)
  spark-silver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - spark-bronze
      - minio
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    command: ["python3", "minio_t.py"]
    # volumes:
    #   - ./checkpoints/silver:/app/checkpoints

  # Gold Service (L 단계 → Gold Layer / Batch)
  spark-gold:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - spark-silver
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123

      # (선택) 처리 범위: 하루치 / 특정 hour만
      # TARGET_DATE: "2025-11-27"
      # TARGET_HOUR: "7"
      TARGET_DATE: ""
      TARGET_HOUR: ""
    command: ["python3", "minio_l.py"]
    restart: "no" # Gold는 배치 잡이라 계속 재시작 x
    volumes:
      - ./minio_l.py:/app/minio_l.py:ro
    ports:
      - "4040:4040"  # Spark UI 포트 매핑

  # ===== Trino + Hive Metastore 추가 =====

  metastore-db:
    image: postgres:15
    container_name: metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5433:5432"
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
      HIVE_AUX_JARS_PATH: /opt/hive/aux/postgresql.jar   
    volumes:
      - ./hive-lib/postgresql.jar:/opt/hive/aux/postgresql.jar:ro  
    depends_on:
      - metastore-db
    ports:
      - "9083:9083"
    command: >
      bash -lc "
        /opt/hive/bin/schematool -dbType postgres -initSchema || true;
        /opt/hive/bin/hive --service metastore
      "
    restart: unless-stopped

  trino:
    image: trinodb/trino:451
    container_name: trino
    ports:
      - "8088:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    depends_on:
      - hive-metastore
    restart: unless-stopped

volumes:
  metastore_db_data: